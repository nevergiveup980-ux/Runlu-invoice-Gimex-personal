name: Build 012 Quick Send

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quick send entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          if 'V4.0 Build 011' not in s:
              raise SystemExit('Expected Build 011 source')

          s = s.replace('RUNLU Invoice V4.0 Build 011', 'RUNLU Invoice V4.0 Build 012')
          s = s.replace('V4.0 Build 011 · Safari Send Fix', 'V4.0 Build 012 · Quick Send Entry')
          s = s.replace(
              '.badge{padding:7px 11px;background:#fff3d6;color:var(--warn)}',
              '.badge{padding:7px 11px;background:#fff3d6;color:var(--warn)}.badge.actionable{cursor:pointer;outline:2px solid #efd994;outline-offset:2px}.badge.actionable:active{transform:scale(.97)}'
          )
          s = s.replace(
              '.next{background:var(--soft);border-radius:14px;padding:14px;margin-top:14px}',
              '.next{background:var(--soft);border-radius:14px;padding:14px;margin-top:14px}.next.actionable{cursor:pointer;border:1px solid #b9cdf8;box-shadow:0 3px 10px rgba(40,100,215,.10)}.next.actionable:active{transform:scale(.99);background:#e3ecff}'
          )
          s = s.replace(
              '<span class="badge" id="statusBadge">NEW</span>',
              '<span class="badge" id="statusBadge" role="button" tabindex="-1" aria-label="Current status">NEW</span>'
          )
          s = s.replace(
              '<div class="next"><b>Next Action</b><span id="nextAction">Generate Package</span></div>',
              '<div class="next" id="nextActionCard" role="button" tabindex="0" aria-label="Next action"><b>Next Action</b><span id="nextAction">Generate Package</span></div>'
          )
          s = s.replace(
              'Build 010 keeps the send confirmation usable even if iOS does not report the share sheet cleanly.',
              'Build 012 makes SEND and Next Action quick-entry controls while keeping the reliable iOS send fallback.'
          )

          marker = re.search(r"function getNextActionLabel\(\)\{[^\n]+\}\n", s)
          if not marker:
              raise SystemExit('getNextActionLabel marker not found')
          jump = "function jumpToCurrentAction(){const st=deriveStatus();let target=null;if(st==='NEW')target=setupCard;else if(st==='REVIEW'){const kind=!reviewDone('admin')?'admin':'wtlc';target=document.getElementById(kind+'Package')}else if(st==='SEND'||st==='SENT')target=mainActionArea;else if(st==='ARCHIVED')target=completedCard;if(target)target.scrollIntoView({behavior:'smooth',block:'start'})}\n"
          s = s[:marker.end()] + jump + s[marker.end():]

          old = "statusBadge.textContent=st;progressBar.style.width=progress()+'%';"
          new = "statusBadge.textContent=st;const statusJump=st==='SEND'||st==='SENT';statusBadge.classList.toggle('actionable',statusJump);statusBadge.tabIndex=statusJump?0:-1;statusBadge.setAttribute('aria-label',statusJump?`${st} — tap to open the action area`:`Current status: ${st}`);progressBar.style.width=progress()+'%';"
          if old not in s:
              raise SystemExit('status render marker not found')
          s = s.replace(old, new, 1)

          old = "document.getElementById('nextAction').textContent=getNextActionLabel();"
          new = "document.getElementById('nextAction').textContent=getNextActionLabel();const actionCard=document.getElementById('nextActionCard');actionCard.classList.toggle('actionable',st!=='ARCHIVED');actionCard.setAttribute('aria-disabled',st==='ARCHIVED'?'true':'false');"
          if old not in s:
              raise SystemExit('next action render marker not found')
          s = s.replace(old, new, 1)

          hook = "document.getElementById('nextActionCard').onclick=jumpToCurrentAction;document.getElementById('nextActionCard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jumpToCurrentAction()}};statusBadge.onclick=()=>{if(deriveStatus()==='SEND'||deriveStatus()==='SENT')jumpToCurrentAction()};statusBadge.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&(deriveStatus()==='SEND'||deriveStatus()==='SENT')){e.preventDefault();jumpToCurrentAction()}};"
          needle = 'render();\n</script>'
          if needle not in s:
              raise SystemExit('final render marker not found')
          s = s.replace(needle, hook + 'render();\n</script>', 1)

          p.write_text(s)
          Path('.github/workflows/build012-quick-send.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/build012-quick-send.yml
          git commit -m "Build 012: make SEND and Next Action quick-entry controls"
          git push
